name: 'Upload Debian Package'
inputs:
  private_key:
    description: 'Private key'
    required: false
    type: string
    default: ""
  repo_name:
    description: 'Repository Name'
    required: true
    type: string
  debian_package_file:
    description: 'Debian package file'
    required: true
    type: string
  remote_user:
    description: 'Remote user'
    required: true
    type: string
  remote_host:
    description: 'Remote host'
    required: true
    type: string
  remote_dir:
    description: 'Remote directory'
    required: true
    type: string

runs:
  using: "composite"    
  steps:
    - name: Add SSH key
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        mkdir /home/runner/.ssh
        ssh-keyscan ${{ inputs.remote_host }} >> /home/runner/.ssh/known_hosts
        if [ -n "${{ inputs.private_key }}" ]; then
          echo "Private key provided"
          echo "${{ inputs.private_key }}" > /home/runner/.ssh/github
          chmod 600 /home/runner/.ssh/github
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add /home/runner/.ssh/github
        fi
      shell: bash
    - name: Upload debian package
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      shell: bash
      run: |
        scp \
          ${{ inputs.debian_package_file }} \
          "${{ inputs.remote_user }}@${{ inputs.remote_host }}:${{ inputs.remote_dir }}/debs"
        ssh \
          ${{ inputs.remote_user }}@${{ inputs.remote_host }} \
          reprepro \
          --basedir ${{ inputs.remote_dir }} \
          includedeb \
          bookworm \
          ${{ inputs.remote_dir }}/debs/${{ inputs.debian_package_file }}
